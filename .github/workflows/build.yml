                  card.addView(hdr);

                  // 1. DRAG HS
                  addFeatureSwitch(card, "feat_drag_hs", "1. DRAG HS",
                          "Injeksi akselerasi Y-Axis & VelocityTracker impulse ke Free Fire",
                          on -> {
                              if (on) {
                                  execFF("1. DRAG HS [AKTIF]",
                                          "settings put system pointer_speed 6;" +
                                          "cmd device_config put input_native_boot velocity_tracker_strategy impulse;" +
                                          "cmd device_config put input_native_boot deep_press_enabled false;" +
                                          "settings put secure tap_duration_threshold 0.0");
                              } else {
                                  execFF("1. DRAG HS [NONAKTIF]",
                                          "settings put system pointer_speed 0;" +
                                          "cmd device_config delete input_native_boot velocity_tracker_strategy");
                              }
                          });

                  // 2. AIM DRAG
                  addFeatureSwitch(card, "feat_aim_drag", "2. AIM DRAG",
                          "Hapus jeda touch blocking & percepat penguncian tarikan aim",
                          on -> {
                              if (on) {
                                  execFF("2. AIM DRAG [AKTIF]",
                                          "settings put secure touch_blocking_period 0.0;" +
                                          "settings put secure long_press_timeout 200;" +
                                          "settings put secure multi_press_timeout 150");
                              } else {
                                  execFF("2. AIM DRAG [NONAKTIF]",
                                          "settings put secure long_press_timeout 400;" +
                                          "settings put secure multi_press_timeout 300");
                              }
                          });

                  // 3. HEADTRICK
                  addFeatureSwitch(card, "feat_headtrick", "3. HEADTRICK",
                          "Injeksi 240Hz Input Event Sampling & presisi vertikal FF (Tanpa ubah DPI HP)",
                          on -> {
                              String pkg = ShizukuShellEngine.targetGamePkg;
                              if (on) {
                                  execFF("3. HEADTRICK [AKTIF]",
                                          "cmd device_config put input_native_boot max_events_per_sec 240;" +
                                          "cmd game mode performance " + pkg + ";" +
                                          "settings put system pointer_speed 7;" +
                                          "settings put secure long_press_timeout 180");
                              } else {
                                  execFF("3. HEADTRICK [NONAKTIF]",
                                          "cmd device_config delete input_native_boot max_events_per_sec;" +
                                          "settings put system pointer_speed 0");
                              }
                          });

                  // 4. AIM SMOOTH
                  addFeatureSwitch(card, "feat_aim_smooth", "4. AIM SMOOTH",
                          "Stabilizer SurfaceFlinger Triple-Buffer agar pergerakan bidikan mulus",
                          on -> {
                              String pkg = ShizukuShellEngine.targetGamePkg;
                              if (on) {
                                  execFF("4. AIM SMOOTH [AKTIF]",
                                          "cmd device_config put surface_flinger_native_boot max_frame_buffer_acquired_buffers 3;" +
                                          "cmd game set --mode 2 --fps 120 " + pkg);
                              } else {
                                  execFF("4. AIM SMOOTH [NONAKTIF]",
                                          "cmd device_config delete surface_flinger_native_boot max_frame_buffer_acquired_buffers");
                              }
                          });

                  // 5. EASY DRAG
                  addFeatureSwitch(card, "feat_easy_drag", "5. EASY DRAG",
                          "Matikan beban animasi compositor sistem untuk fling layar instan",
                          on -> {
                              if (on) {
                                  execFF("5. EASY DRAG [AKTIF]",
                                          "settings put global window_animation_scale 0.0;" +
                                          "settings put global transition_animation_scale 0.0;" +
                                          "settings put global animator_duration_scale 0.0");
                              } else {
                                  execFF("5. EASY DRAG [NONAKTIF]",
                                          "settings put global window_animation_scale 1.0;" +
                                          "settings put global transition_animation_scale 1.0;" +
                                          "settings put global animator_duration_scale 1.0");
                              }
                          });

                  // 6. CONTROL RECOIL
                  addFeatureSwitch(card, "feat_recoil", "6. CONTROL RECOIL",
                          "Redam getaran mikro (jitter) saat menahan tombol tembak",
                          on -> {
                              if (on) {
                                  execFF("6. CONTROL RECOIL [AKTIF]",
                                          "settings put secure touch_exploration_enabled 0;" +
                                          "settings put secure show_touches 0;" +
                                          "settings put system pointer_speed 4");
                              } else {
                                  execFF("6. CONTROL RECOIL [NONAKTIF]",
                                          "settings put system pointer_speed 0");
                              }
                          });

                  // 7. PELICIN LAYAR 1-7
                  LinearLayout sliderBox = new LinearLayout(this);
                  sliderBox.setOrientation(LinearLayout.VERTICAL);
                  sliderBox.setPadding(20, 16, 20, 16);
                  GradientDrawable sbBg = new GradientDrawable();
                  sbBg.setColor(Color.parseColor("#1B0936"));
                  sbBg.setStroke(2, Color.parseColor("#00FFCC"));
                  sbBg.setCornerRadius(16f);
                  sliderBox.setBackground(sbBg);

                  final TextView pelicinTv = new TextView(this);
                  pelicinTv.setText("7. PELICIN LAYAR [ LEVEL 1 / 7 ]");
                  pelicinTv.setTextColor(Color.parseColor("#00FFCC"));
                  pelicinTv.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  pelicinTv.setTextSize(11.5f);
                  sliderBox.addView(pelicinTv);

                  SeekBar seek = new SeekBar(this);
                  seek.setMax(6);
                  seek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int progress, boolean fromUser) {
                          pelicinTv.setText(String.format(Locale.US, "7. PELICIN LAYAR [ LEVEL %d / 7 ]", progress + 1));
                      }
                      @Override public void onStartTrackingTouch(SeekBar s) {}
                      @Override
                      public void onStopTrackingTouch(SeekBar s) {
                          int lvl = s.getProgress() + 1;
                          int hz = 120 + (lvl * 20);
                          int lp = 380 - (lvl * 30);
                          String cmd = String.format(Locale.US,
                                  "settings put system pointer_speed %d;" +
                                  "settings put secure long_press_timeout %d;" +
                                  "cmd device_config put input_native_boot max_events_per_sec %d",
                                  lvl, lp, hz);
                          execFF("7. PELICIN LAYAR -> LEVEL " + lvl + " (" + hz + "Hz)", cmd);
                      }
                  });
                  sliderBox.addView(seek);
                  card.addView(sliderBox);

                  parent.addView(card);
              }

