              // Anti Force-Close Foreground starter wrapped in try-catch for all Android ROMs
              private void safeStartForeground() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel chan = new NotificationChannel(
                                  CHANNEL_ID, "DFD TOOLS VIP Overlay", NotificationManager.IMPORTANCE_LOW);
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.createNotificationChannel(chan);

                          Notification notif = new Notification.Builder(this, CHANNEL_ID)
                                  .setContentTitle("DFD TOOLS // DANZ INJECT VIP")
                                  .setContentText("Floating Injector Aktif • Tap logo untuk membuka panel")
                                  .setSmallIcon(android.R.drawable.ic_media_play)
                                  .build();
                          startForeground(1337, notif);
                      }
                  } catch (Throwable ignored) {
                      // Even if Android 14+ blocks foreground notification, service keeps running smoothly
                  }
              }

