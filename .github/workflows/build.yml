                          rogTelemetryText.setText(String.format(Locale.US,
                                  "👑 DANZ ROG | %d FPS | %.1f°C | RAM %d%% | %s",
                                  liveFps, tempC, ramPct, bridge));
                          uiHandler.postDelayed(this, 1000L);
                      }
                  }
              };

