name: Build DFD TOOLS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Generate Full VIP Project & Custom APK Icon
        shell: bash
        run: |
          set -e
          rm -rf app/build
          mkdir -p app/src/main/java/com/danz/dfdtools
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          # 1. Buat Vector Icon Mahkota Ungu DANZ INJECT untuk Icon APK (Anti Robot Hijau)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#08020F"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#1A0633"
                  android:pathData="M54,54m-46,0a46,46 0,1 1,92 0a46,46 0,1 1,-92 0" />
              <path
                  android:strokeColor="#A855F7"
                  android:strokeWidth="2.5"
                  android:fillColor="#00000000"
                  android:pathData="M54,54m-42,0a42,42 0,1 1,84 0a42,42 0,1 1,-84 0" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Outer Cyber Ring -->
              <path
                  android:strokeColor="#D946EF"
                  android:strokeWidth="3"
                  android:fillColor="#00000000"
                  android:pathData="M54,54m-32,0a32,32 0,1 1,64 0a32,32 0,1 1,-64 0" />
              <!-- Purple Royal Crown -->
              <path
                  android:fillColor="#E879F9"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="1.2"
                  android:pathData="M34,47 L30,30 L43,39 L54,25 L65,39 L78,30 L74,47 Z" />
              <!-- Crown Base Bar -->
              <path
                  android:fillColor="#9333EA"
                  android:pathData="M34,49 L74,49 L74,53 L34,53 Z" />
              <!-- Stylized 'D' Emblem -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M43,57 L57,57 C64,57 68,61 68,67 C68,73 64,77 57,77 L43,77 Z M49,62 L49,72 L56,72 C60,72 62,70 62,67 C62,64 60,62 56,62 Z" />
              <!-- Crosshair Target Accents -->
              <path
                  android:strokeColor="#00FFCC"
                  android:strokeWidth="2"
                  android:pathData="M54,16 L54,22 M54,86 L54,92 M16,54 L22,54 M86,54 L92,54" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # Jika user sudah upload file foto (.jpg/.png) di repo, salin otomatis ke assets & drawable
          FOUND_IMG=$(find . -maxdepth 4 \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | head -n 1 || true)
          if [ -n "$FOUND_IMG" ]; then
            cp "$FOUND_IMG" app/src/main/assets/dfd_logo.jpg || true
            cp "$FOUND_IMG" app/src/main/res/drawable/dfd_custom_logo.jpg || true
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "DFD TOOLS"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # targetSdk 33 menjamin Service & Overlay berjalan di Android 10-15 tanpa crash MissingForegroundServiceTypeException
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.danz.dfdtools'
              compileSdk 34

              defaultConfig {
                  applicationId "com.danz.dfdtools"
                  minSdk 26
                  targetSdk 33
                  versionCode 20
                  versionName "2.0-DANZVIP"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }

          dependencies {
              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
