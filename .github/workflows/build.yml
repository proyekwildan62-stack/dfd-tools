              // Custom Cyberpunk Injector Card with Status Badge (OFF / INJECTED)
              private void addCyberSwitchCard(LinearLayout parent, String title, String subtitle, FeatureToggleCallback cb) {
                  final LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.HORIZONTAL);
                  card.setGravity(Gravity.CENTER_VERTICAL);
                  card.setPadding(20, 16, 20, 16);

                  final GradientDrawable cardBg = new GradientDrawable();
                  cardBg.setColor(Color.parseColor("#16072C"));
                  cardBg.setStroke(2, Color.parseColor("#581C87"));
                  cardBg.setCornerRadius(16f);
                  card.setBackground(cardBg);

                  LinearLayout textCol = new LinearLayout(this);
                  textCol.setOrientation(LinearLayout.VERTICAL);

                  final TextView titleTv = new TextView(this);
                  titleTv.setText(title);
                  titleTv.setTextColor(Color.WHITE);
                  titleTv.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  titleTv.setTextSize(11.5f);
                  textCol.addView(titleTv);

                  TextView subTv = new TextView(this);
                  subTv.setText(subtitle);
                  subTv.setTextColor(Color.parseColor("#C084FC"));
                  subTv.setTextSize(9.5f);
                  textCol.addView(subTv);

                  card.addView(textCol, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  final TextView statusBadge = new TextView(this);
                  statusBadge.setText("OFF");
                  statusBadge.setTextColor(Color.parseColor("#FCA5A5"));
                  statusBadge.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  statusBadge.setTextSize(10f);
                  statusBadge.setPadding(20, 10, 20, 10);

                  final GradientDrawable badgeBg = new GradientDrawable();
                  badgeBg.setColor(Color.parseColor("#310B2B"));
                  badgeBg.setStroke(2, Color.parseColor("#F43F5E"));
                  badgeBg.setCornerRadius(30f);
                  statusBadge.setBackground(badgeBg);
                  card.addView(statusBadge);

                  final boolean[] state = {false};
                  card.setOnClickListener(v -> {
                      state[0] = !state[0];
                      if (state[0]) {
                          cardBg.setColor(Color.parseColor("#250A47"));
                          cardBg.setStroke(3, Color.parseColor("#00FFCC"));
                          titleTv.setTextColor(Color.parseColor("#00FFCC"));
                          statusBadge.setText("ON ⚡");
                          statusBadge.setTextColor(Color.parseColor("#052E16"));
                          badgeBg.setColor(Color.parseColor("#00FFCC"));
                          badgeBg.setStroke(2, Color.WHITE);
                      } else {
                          cardBg.setColor(Color.parseColor("#16072C"));
                          cardBg.setStroke(2, Color.parseColor("#581C87"));
                          titleTv.setTextColor(Color.WHITE);
                          statusBadge.setText("OFF");
                          statusBadge.setTextColor(Color.parseColor("#FCA5A5"));
                          badgeBg.setColor(Color.parseColor("#310B2B"));
                          badgeBg.setStroke(2, Color.parseColor("#F43F5E"));
                      }
                      cb.onToggle(state[0]);
                  });

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.bottomMargin = 12;
                  card.setLayoutParams(lp);
                  parent.addView(card);
              }

