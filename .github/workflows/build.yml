      - name: 4. Install SDK & Compile APK
        shell: bash
        run: |
          set -e
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 5. Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: DFD-TOOLS-DANZVIP-V4-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
