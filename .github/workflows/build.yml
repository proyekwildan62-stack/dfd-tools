              private void copyToClipboard(String label, String value) {
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null) {
                      cm.setPrimaryClip(ClipData.newPlainText(label, value));
                  }
              }
