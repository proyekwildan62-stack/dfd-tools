          EOF

          cat << 'EOF' > app/src/main/java/com/danz/dfdtools/LicenseEngine.java
          package com.danz.dfdtools;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.provider.Settings;

          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.Locale;

          import javax.crypto.Mac;
          import javax.crypto.spec.SecretKeySpec;

          public final class LicenseEngine {

              public static final String MASTER_DEV_KEY = "DANZVIP";
              private static final String HMAC_SECRET = "DFD_TOOLS_DANZ_INJECT_2026_PURPLE_CROWN_SECRET_KEY";
              private static final String PREF_NAME = "dfd_license_vault";
              private static final String KEY_SAVED_TOKEN = "bound_token";
              private static final String KEY_SAVED_HWID = "bound_hwid";
              private static final String KEY_FIRST_BIND_MS = "first_bind_ms";

              public enum Tier {
                  DAY_1("1D", 1L * 86400_000L, "1 DAY VIP"),
                  DAY_3("3D", 3L * 86400_000L, "3 DAYS VIP"),
                  DAY_7("7D", 7L * 86400_000L, "7 DAYS VIP"),
                  DAY_15("15D", 15L * 86400_000L, "15 DAYS VIP"),
                  DAY_30("30D", 30L * 86400_000L, "30 DAYS VIP"),
                  PERM("PERM", 36500L * 86400_000L, "PERMANENT VIP"),
                  RESELLER("RSL", 36500L * 86400_000L, "RESELLER ACCESS");

                  public final String code;
                  public final long durationMs;
                  public final String label;

                  Tier(String code, long durationMs, String label) {
                      this.code = code;
                      this.durationMs = durationMs;
                      this.label = label;
                  }

                  public static Tier fromCode(String code) {
                      for (Tier t : values()) {
                          if (t.code.equalsIgnoreCase(code)) return t;
                      }
                      return null;
                  }
              }

              public static class AuthResult {
                  public final boolean valid;
                  public final boolean isDeveloper;
                  public final boolean isReseller;
                  public final String tierName;
                  public final String message;

                  public AuthResult(boolean valid, boolean isDeveloper, boolean isReseller, String tierName, String message) {
                      this.valid = valid;
                      this.isDeveloper = isDeveloper;
                      this.isReseller = isReseller;
                      this.tierName = tierName;
                      this.message = message;
                  }
              }

              public static String getDeviceHwid(Context ctx) {
                  String androidId = Settings.Secure.getString(ctx.getContentResolver(), Settings.Secure.ANDROID_ID);
                  if (androidId == null) androidId = "UNKNOWN_AID";
                  String raw = androidId + "|" + Build.BOARD + "|" + Build.BRAND + "|" + Build.HARDWARE;
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] digest = md.digest(raw.getBytes(StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < 4; i++) {
                          sb.append(String.format(Locale.US, "%02X", digest[i]));
                      }
                      return "DFD-" + sb.toString();
                  } catch (Exception e) {
                      return "DFD-00000000";
                  }
              }

              public static String generateKey(String targetHwid, Tier tier) {
                  String cleanHwid = (targetHwid == null || targetHwid.trim().isEmpty())
                          ? "BIND1"
                          : targetHwid.trim().toUpperCase(Locale.US).replace("DFD-", "");
                  long issueEpochHours = System.currentTimeMillis() / 3600_000L;
                  String payload = tier.code + "-" + cleanHwid + "-" + Long.toHexString(issueEpochHours).toUpperCase(Locale.US);
                  String sig = computeHmacHex(payload).substring(0, 8);
                  return "DFD-" + payload + "-" + sig;
              }

              public static AuthResult verifyAndBindKey(Context ctx, String inputKey) {
                  if (inputKey == null || inputKey.trim().isEmpty()) {
                      return new AuthResult(false, false, false, "NONE", "Masukkan License Key terlebih dahulu.");
                  }
                  String key = inputKey.trim();

                  if (MASTER_DEV_KEY.equals(key)) {
                      saveBoundSession(ctx, key, getDeviceHwid(ctx));
                      return new AuthResult(true, true, true, "DEVELOPER MASTER", "UNLOCKED • FULL ACCESS + KEYGEN");
                  }

                  String[] parts = key.split("-");
                  if (parts.length != 5 || !"DFD".equalsIgnoreCase(parts[0])) {
                      return new AuthResult(false, false, false, "INVALID", "Format Key tidak sesuai standar DFD.");
                  }

                  String tierCode = parts[1].toUpperCase(Locale.US);
                  String keyHwidPart = parts[2].toUpperCase(Locale.US);
                  String issueHex = parts[3].toUpperCase(Locale.US);
                  String providedSig = parts[4].toUpperCase(Locale.US);

                  Tier tier = Tier.fromCode(tierCode);
                  if (tier == null) {
                      return new AuthResult(false, false, false, "INVALID", "Kode durasi Key tidak valid.");
                  }

                  String payload = tierCode + "-" + keyHwidPart + "-" + issueHex;
                  String expectedSig = computeHmacHex(payload).substring(0, 8);
                  if (!expectedSig.equals(providedSig)) {
                      return new AuthResult(false, false, false, "INVALID", "Signature kriptografi Key tidak sah!");
                  }

                  String currentDeviceHwid = getDeviceHwid(ctx);
                  String currentShortHwid = currentDeviceHwid.replace("DFD-", "");

                  if (!"BIND1".equals(keyHwidPart) && !currentShortHwid.equals(keyHwidPart)) {
                      return new AuthResult(false, false, false, "LOCKED",
                              "DITOLAK! Key ini milik HWID DFD-" + keyHwidPart + " (1 Key 1 Device).");
                  }

                  SharedPreferences prefs = ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                  String savedToken = prefs.getString(KEY_SAVED_TOKEN, null);
                  String savedHwid = prefs.getString(KEY_SAVED_HWID, null);
                  long firstBindMs = prefs.getLong(KEY_FIRST_BIND_MS, 0L);

                  long issueMs;
                  try {
                      issueMs = Long.parseLong(issueHex, 16) * 3600_000L;
                  } catch (NumberFormatException e) {
                      return new AuthResult(false, false, false, "ERROR", "Timestamp Key rusak.");
                  }

                  long now = System.currentTimeMillis();
                  long startAnchor = (key.equals(savedToken) && firstBindMs > 0) ? firstBindMs : Math.min(now, issueMs);
                  if (!key.equals(savedToken)) {
                      prefs.edit()
                              .putString(KEY_SAVED_TOKEN, key)
                              .putString(KEY_SAVED_HWID, currentDeviceHwid)
                              .putLong(KEY_FIRST_BIND_MS, now)
                              .apply();
                      startAnchor = now;
                  } else if (savedHwid != null && !savedHwid.equals(currentDeviceHwid)) {
                      return new AuthResult(false, false, false, "LOCKED", "1 Key 1 Device: Perangkat berbeda!");
                  }

                  long elapsed = Math.max(Math.max(0L, now - issueMs), Math.max(0L, now - startAnchor));
                  if (elapsed > tier.durationMs) {
                      return new AuthResult(false, false, false, "EXPIRED", "Masa aktif Key (" + tier.label + ") telah habis.");
                  }

                  long remHours = Math.max(1L, (tier.durationMs - elapsed) / 3600_000L);
                  boolean isReseller = (tier == Tier.RESELLER);
                  return new AuthResult(true, false, isReseller, tier.label,
                          "TERIKAT KE " + currentDeviceHwid + " • Sisa: " + remHours + " Jam");
              }

              private static void saveBoundSession(Context ctx, String token, String hwid) {
                  ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putString(KEY_SAVED_TOKEN, token)
                          .putString(KEY_SAVED_HWID, hwid)
                          .putLong(KEY_FIRST_BIND_MS, System.currentTimeMillis())
                          .apply();
              }

              public static String getSavedKey(Context ctx) {
                  return ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE).getString(KEY_SAVED_TOKEN, "");
              }

              private static String computeHmacHex(String data) {
                  try {
                      Mac mac = Mac.getInstance("HmacSHA256");
                      SecretKeySpec spec = new SecretKeySpec(HMAC_SECRET.getBytes(StandardCharsets.UTF_8), "HmacSHA256");
                      mac.init(spec);
                      byte[] raw = mac.doFinal(data.getBytes(StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      for (byte b : raw) {
                          sb.append(String.format(Locale.US, "%02X", b));
                      }
                      return sb.toString();
                  } catch (Exception e) {
                      return "0000000000000000";
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/danz/dfdtools/ShizukuShellEngine.java
          package com.danz.dfdtools;

          import android.content.pm.PackageManager;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.lang.reflect.Method;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          import rikka.shizuku.Shizuku;

          public final class ShizukuShellEngine {

              private static final ExecutorService EXECUTOR = Executors.newSingleThreadExecutor();

              public interface ExecutionCallback {
                  void onComplete(boolean viaShizuku, int exitCode, String output);
              }

              public static boolean isShizukuReady() {
                  try {
                      if (!Shizuku.pingBinder()) return false;
                      return Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              public static void requestShizukuPermission(int requestCode) {
                  try {
                      if (Shizuku.pingBinder() && Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                          Shizuku.requestPermission(requestCode);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              public static void execAsync(final String commandBlock, final ExecutionCallback callback) {
                  EXECUTOR.execute(() -> {
                      boolean usedShizuku = false;
                      int code = -1;
                      StringBuilder out = new StringBuilder();
                      Process proc = null;

                      try {
                          if (isShizukuReady()) {
                              usedShizuku = true;
                              Method newProcMethod = Shizuku.class.getDeclaredMethod(
                                      "newProcess", String[].class, String[].class, String.class);
                              newProcMethod.setAccessible(true);
                              proc = (Process) newProcMethod.invoke(
                                      null, new String[]{"sh"}, null, null);
                          } else {
                              proc = Runtime.getRuntime().exec(new String[]{"sh"});
                          }

                          if (proc != null) {
                              OutputStream os = proc.getOutputStream();
                              os.write((commandBlock + "\nexit\n").getBytes(StandardCharsets.UTF_8));
                              os.flush();
                              os.close();

                              BufferedReader br = new BufferedReader(new InputStreamReader(proc.getInputStream()));
                              String line;
                              while ((line = br.readLine()) != null) {
                                  out.append(line).append('\n');
                              }
                              br.close();
                              code = proc.waitFor();
                          }
                      } catch (Throwable e) {
                          out.append("ERR: ").append(e.getMessage());
                      } finally {
                          if (proc != null) proc.destroy();
                      }

                      if (callback != null) {
                          callback.onComplete(usedShizuku, code, out.toString().trim());
                      }
                  });
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/danz/dfdtools/LogoHelper.java
          package com.danz.dfdtools;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PorterDuff;
          import android.graphics.PorterDuffXfermode;
          import android.graphics.Rect;
          import android.graphics.Shader;
          import android.graphics.Typeface;

          import java.io.InputStream;

          public final class LogoHelper {

              public static Bitmap loadCircularLogo(Context ctx, int sizePx) {
                  Bitmap raw = null;
                  try {
                      int resId = ctx.getResources().getIdentifier("dfd_custom_logo", "drawable", ctx.getPackageName());
                      if (resId != 0) {
                          raw = BitmapFactory.decodeResource(ctx.getResources(), resId);
                      }
                      if (raw == null) {
                          InputStream is = ctx.getAssets().open("dfd_logo.jpg");
                          raw = BitmapFactory.decodeStream(is);
                          is.close();
                      }
                  } catch (Throwable ignored) {
                  }

                  if (raw == null) {
                      return renderCyberpunkDanzEmblem(sizePx);
                  }

                  Bitmap scaled = Bitmap.createScaledBitmap(raw, sizePx, sizePx, true);
                  Bitmap output = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(output);

                  final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Rect rect = new Rect(0, 0, sizePx, sizePx);

                  canvas.drawCircle(sizePx / 2f, sizePx / 2f, (sizePx / 2f) - 4f, paint);
                  paint.setXfermode(new PorterDuffXfermode(PorterDuff.Mode.SRC_IN));
                  canvas.drawBitmap(scaled, rect, rect, paint);

                  Paint border = new Paint(Paint.ANTI_ALIAS_FLAG);
                  border.setStyle(Paint.Style.STROKE);
                  border.setStrokeWidth(6f);
                  border.setShader(new LinearGradient(0, 0, sizePx, sizePx,
                          Color.parseColor("#E879F9"), Color.parseColor("#00FFCC"), Shader.TileMode.CLAMP));
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f, (sizePx / 2f) - 3f, border);

                  return output;
              }

              private static Bitmap renderCyberpunkDanzEmblem(int size) {
                  Bitmap bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(bmp);
                  float cx = size / 2f;
                  float cy = size / 2f;

                  Paint bg = new Paint(Paint.ANTI_ALIAS_FLAG);
                  bg.setShader(new LinearGradient(0, 0, 0, size,
                          Color.parseColor("#18062C"), Color.parseColor("#07020D"), Shader.TileMode.CLAMP));
                  c.drawCircle(cx, cy, cx - 3, bg);

                  Paint outerGlow = new Paint(Paint.ANTI_ALIAS_FLAG);
                  outerGlow.setStyle(Paint.Style.STROKE);
                  outerGlow.setStrokeWidth(size * 0.045f);
                  outerGlow.setShader(new LinearGradient(0, 0, size, size,
                          Color.parseColor("#F0ABFC"), Color.parseColor("#7E22CE"), Shader.TileMode.CLAMP));
                  c.drawCircle(cx, cy, cx - (size * 0.055f), outerGlow);

                  // Hooded Cyber Crown Silhouette
                  Paint crown = new Paint(Paint.ANTI_ALIAS_FLAG);
                  crown.setShader(new LinearGradient(0, size * 0.12f, 0, size * 0.42f,
                          Color.parseColor("#F5D0FE"), Color.parseColor("#9333EA"), Shader.TileMode.CLAMP));
                  Path p = new Path();
                  p.moveTo(size * 0.25f, size * 0.39f);
                  p.lineTo(size * 0.20f, size * 0.19f);
                  p.lineTo(size * 0.37f, size * 0.29f);
                  p.lineTo(size * 0.50f, size * 0.13f);
                  p.lineTo(size * 0.63f, size * 0.29f);
                  p.lineTo(size * 0.80f, size * 0.19f);
                  p.lineTo(size * 0.75f, size * 0.39f);
                  p.close();
                  c.drawPath(p, crown);

                  // Glowing Eyes
                  Paint eye = new Paint(Paint.ANTI_ALIAS_FLAG);
                  eye.setColor(Color.parseColor("#E879F9"));
                  c.drawCircle(size * 0.41f, size * 0.46f, size * 0.025f, eye);
                  c.drawCircle(size * 0.59f, size * 0.46f, size * 0.025f, eye);

                  // DANZ Typography
                  Paint txt = new Paint(Paint.ANTI_ALIAS_FLAG);
                  txt.setColor(Color.WHITE);
                  txt.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD_ITALIC));
                  txt.setTextAlign(Paint.Align.CENTER);
                  txt.setTextSize(size * 0.22f);
                  txt.setShadowLayer(10f, 0f, 0f, Color.parseColor("#D946EF"));
                  c.drawText("DANZ", cx, cy + (size * 0.16f), txt);

                  Paint sub = new Paint(Paint.ANTI_ALIAS_FLAG);
                  sub.setColor(Color.parseColor("#00FFCC"));
                  sub.setTypeface(Typeface.MONOSPACE);
                  sub.setTextAlign(Paint.Align.CENTER);
                  sub.setTextSize(size * 0.095f);
                  c.drawText("INJECT VIP", cx, cy + (size * 0.30f), sub);

                  return bmp;
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/danz/dfdtools/MainActivity.java
          package com.danz.dfdtools;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
