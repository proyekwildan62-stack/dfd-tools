              private void copyText(String val) {
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null) cm.setPrimaryClip(ClipData.newPlainText("DFD", val));
              }

              private class CrosshairPreviewView extends View {
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  public CrosshairPreviewView(Context ctx) {
                      super(ctx);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);
                      float cx = getWidth() / 2f;
                      float cy = getHeight() / 2f;
                      c.drawColor(Color.parseColor("#08020F"));
                      if (crosshairStyle == 0) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(3.5f);
                          p.setColor(Color.parseColor("#D946EF"));
                          c.drawCircle(cx, cy, 22f, p);
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(Color.parseColor("#00FFCC"));
                          c.drawCircle(cx, cy, 4.5f, p);
                      } else if (crosshairStyle == 1) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(3f);
                          p.setColor(Color.parseColor("#00FFCC"));
                          c.drawLine(cx - 28f, cy, cx - 7f, cy, p);
                          c.drawLine(cx + 7f, cy, cx + 28f, cy, p);
                          c.drawLine(cx, cy - 28f, cx, cy - 7f, p);
                          c.drawLine(cx, cy + 7f, cx, cy + 28f, p);
                      } else {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(3f);
                          p.setColor(Color.parseColor("#FACC15"));
                          c.drawRect(cx - 20f, cy - 20f, cx + 20f, cy + 20f, p);
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(Color.parseColor("#FF0055"));
                          c.drawCircle(cx, cy, 4f, p);
                      }
                  }
              }
          }
