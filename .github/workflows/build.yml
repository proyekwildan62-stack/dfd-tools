              // Safe Launch without Force Close on Android 10-15
              private void launchOverlayAndGame(boolean openGameAfter) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName()));
                          startActivityForResult(intent, REQ_OVERLAY);
                          Toast.makeText(this, "Berikan izin 'Tampilkan di atas aplikasi lain' lalu klik lagi!", Toast.LENGTH_LONG).show();
                          return;
                      }

                      Intent svc = new Intent(this, DfdOverlayService.class);
                      svc.putExtra("TARGET_PKG", selectedGamePkg);
                      startService(svc);

                      if (openGameAfter) {
                          Intent launchIntent = getPackageManager().getLaunchIntentForPackage(selectedGamePkg);
                          if (launchIntent != null) {
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(launchIntent);
                          } else {
                              Toast.makeText(this, "Floating VIP Aktif! (Game " + selectedGamePkg + " belum terinstall, silakan buka manual).", Toast.LENGTH_LONG).show();
                          }
                      } else {
                          Toast.makeText(this, "Floating Panel DFD TOOLS Aktif di layar!", Toast.LENGTH_SHORT).show();
                      }
                  } catch (Throwable t) {
                      Toast.makeText(this, "Gagal membuka overlay: " + t.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void switchMainTab(int index) {
                  tabContainerAuth.setVisibility(index == 0 ? View.VISIBLE : View.GONE);
                  tabContainerLauncher.setVisibility(index == 1 ? View.VISIBLE : View.GONE);
                  tabContainerKeygen.setVisibility(index == 2 ? View.VISIBLE : View.GONE);

                  styleTabButton(navBtnAuth, index == 0);
                  styleTabButton(navBtnLauncher, index == 1);
                  styleTabButton(navBtnKeygen, index == 2);
              }

