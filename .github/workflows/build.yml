                  } else {
                      pillShizuku.setText("○ SHIZUKU: STANDBY");
                      pillShizuku.setTextColor(Color.parseColor("#FBBF24"));
                  }

                  if (isAuthorized) {
                      pillLicense.setText("● VIP: UNLOCKED");
                      pillLicense.setTextColor(Color.parseColor("#4ADE80"));
                  } else {
                      pillLicense.setText("○ VIP: LOCKED");
                      pillLicense.setTextColor(Color.parseColor("#FB7185"));
                  }
              }

