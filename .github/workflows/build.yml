                  // 12. GAME SPACE + GRAFIK RINGAN ROG/PC (Hanya meng-downscale buffer internal Free Fire, BUKAN layar HP!)
                  addSwitchRow(tabSystem, "12. GAME SPACE + GRAFIK RINGAN ROG/PC", "Downscale render internal FF 0.75x + Unlock 120FPS", on -> {
                      if (on) {
                          injectFF("GAME SPACE FF [ON]",
                                  "cmd game mode performance " + pkg + ";" +
                                  "cmd game set --mode 2 --downscale 0.75 --fps 120 " + pkg + ";" +
                                  "settings put system peak_refresh_rate 120.0;" +
                                  "settings put system min_refresh_rate 120.0;" +
                                  "cmd notification set_dnd priority");
                      } else {
                          injectFF("GAME SPACE FF [OFF]",
                                  "cmd game reset " + pkg + ";" +
                                  "settings put system min_refresh_rate 60.0;" +
                                  "cmd notification set_dnd off");
                      }
                  });

                  // === TAB 3: ROG HUD & KOSTUM BIDIKAN ===
                  // 10. KOSTUM BIDIKAN
                  addSwitchRow(tabVisual, "10. KOSTUM BIDIKAN", "Crosshair tengah layar khusus tembak kepala", this::toggleReticle);

                  Button changeReticleBtn = new Button(this);
                  changeReticleBtn.setText("UBAH TIPE BIDIKAN (DOT / CROSS / BRACKET)");
                  changeReticleBtn.setTextColor(Color.WHITE);
                  changeReticleBtn.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  changeReticleBtn.setTextSize(10f);
                  changeReticleBtn.setBackgroundColor(Color.parseColor("#581C87"));
                  changeReticleBtn.setOnClickListener(v -> {
                      reticleType = (reticleType + 1) % 3;
                      if (reticleView != null) reticleView.invalidate();
                  });
                  tabVisual.addView(changeReticleBtn);

                  // 11. PEMANTAUAN ROG
                  addSwitchRow(tabVisual, "11. PEMANTAUAN ROG", "Live FPS, Suhu Baterai/SoC & Penggunaan RAM", this::toggleRogHud);

                  menuWindow = box;
                  holder.addView(menuWindow);
                  rootFloating = holder;

                  mainLp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                  );
                  mainLp.gravity = Gravity.TOP | Gravity.START;
                  mainLp.x = 25;
                  mainLp.y = 160;

                  makeDraggable(header, rootFloating, mainLp);
                  makeDraggable(iconBubble, rootFloating, mainLp);

                  try {
                      wm.addView(rootFloating, mainLp);
                      isMainShown = true;
                  } catch (Throwable ignored) {
                  }
              }

              private void selectTab(int i) {
                  tabCombat.setVisibility(i == 0 ? View.VISIBLE : View.GONE);
                  tabSystem.setVisibility(i == 1 ? View.VISIBLE : View.GONE);
                  tabVisual.setVisibility(i == 2 ? View.VISIBLE : View.GONE);
                  styleTab(btnTab1, i == 0);
                  styleTab(btnTab2, i == 1);
                  styleTab(btnTab3, i == 2);
              }

              private Button makeTabBtn(String txt, boolean active) {
                  Button b = new Button(this);
                  b.setText(txt);
                  b.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  b.setTextSize(10f);
                  styleTab(b, active);
                  return b;
              }

              private void styleTab(Button b, boolean active) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor(active ? "#9333EA" : "#1A0933"));
                  gd.setStroke(2, Color.parseColor(active ? "#00FFCC" : "#581C87"));
                  gd.setCornerRadius(12f);
                  b.setBackground(gd);
                  b.setTextColor(active ? Color.WHITE : Color.parseColor("#C084FC"));
              }

              private interface SwitchListener {
                  void onChanged(boolean isChecked);
              }

              private void addSwitchRow(LinearLayout parent, String title, String desc, SwitchListener listener) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(18, 14, 18, 14);

                  final GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#16072C"));
                  bg.setStroke(2, Color.parseColor("#4C1D95"));
                  bg.setCornerRadius(14f);
                  row.setBackground(bg);

                  LinearLayout textCol = new LinearLayout(this);
                  textCol.setOrientation(LinearLayout.VERTICAL);

                  final TextView t1 = new TextView(this);
                  t1.setText(title);
                  t1.setTextColor(Color.WHITE);
                  t1.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  t1.setTextSize(11f);
                  textCol.addView(t1);

                  TextView t2 = new TextView(this);
                  t2.setText(desc);
                  t2.setTextColor(Color.parseColor("#C084FC"));
                  t2.setTextSize(9.5f);
                  textCol.addView(t2);

                  row.addView(textCol, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  Switch sw = new Switch(this);
                  sw.setOnCheckedChangeListener((buttonView, isChecked) -> {
                      bg.setColor(Color.parseColor(isChecked ? "#260B4A" : "#16072C"));
                      bg.setStroke(2, Color.parseColor(isChecked ? "#00FFCC" : "#4C1D95"));
                      t1.setTextColor(isChecked ? Color.parseColor("#00FFCC") : Color.WHITE);
                      listener.onChanged(isChecked);
                  });
                  row.addView(sw);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.bottomMargin = 10;
                  row.setLayoutParams(lp);
                  parent.addView(row);
              }

              private void injectFF(final String label, String script) {
                  ShizukuShellEngine.injectToFreeFire(script, (shizukuUsed, code, out) -> {
                      handler.post(() -> {
                          String mode = shizukuUsed ? "SHIZUKU-FF" : "LOCAL-FF";
                          liveStatusFooter.setText(String.format(Locale.US, "[%s] %s -> INJECTED", mode, label));
                      });
                  });
              }

              private void initReticle() {
                  reticleView = new ReticleView();
                  reticleLp = new WindowManager.LayoutParams(
                          140, 140,
                          overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                  );
                  reticleLp.gravity = Gravity.CENTER;
              }

              private void initRogHud() {
                  LinearLayout bar = new LinearLayout(this);
                  bar.setPadding(22, 8, 22, 8);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#E6090314"));
                  bg.setStroke(3, Color.parseColor("#00FFCC"));
                  bg.setCornerRadius(24f);
                  bar.setBackground(bg);

                  rogHudText = new TextView(this);
                  rogHudText.setTextColor(Color.parseColor("#00FFCC"));
                  rogHudText.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  rogHudText.setTextSize(10.5f);
                  rogHudText.setText("👑 DFD ROG | FPS: 60 | TEMP: 37.5°C | RAM: --%");
                  bar.addView(rogHudText);

                  rogHudBar = bar;
                  rogLp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                  );
                  rogLp.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  rogLp.y = 18;
              }

              private void toggleReticle(boolean show) {
                  try {
                      if (show && !isReticleShown) {
                          wm.addView(reticleView, reticleLp);
                          isReticleShown = true;
                      } else if (!show && isReticleShown) {
                          wm.removeView(reticleView);
                          isReticleShown = false;
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private void toggleRogHud(boolean show) {
                  try {
                      if (show && !isRogShown) {
                          wm.addView(rogHudBar, rogLp);
                          isRogShown = true;
                          lastNs = 0;
                          frames = 0;
                          Choreographer.getInstance().postFrameCallback(fpsCounter);
                          handler.post(hudUpdater);
                      } else if (!show && isRogShown) {
                          isRogShown = false;
                          handler.removeCallbacks(hudUpdater);
                          wm.removeView(rogHudBar);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private float getBatteryTemp() {
                  try {
                      Intent i = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      if (i != null) {
                          int t = i.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 375);
                          return t / 10f;
                      }
                  } catch (Throwable ignored) {
                  }
                  return 37.5f;
              }

              private int getRamPercent() {
                  try {
                      ActivityManager am = (ActivityManager) getSystemService(ACTIVITY_SERVICE);
                      ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                      if (am != null) {
                          am.getMemoryInfo(mi);
                          return (int) (((mi.totalMem - mi.availMem) * 100L) / mi.totalMem);
                      }
                  } catch (Throwable ignored) {
                  }
                  return 50;
              }

              private void updateViewSafe(View v, WindowManager.LayoutParams lp) {
                  try {
                      if (isMainShown && v != null) wm.updateViewLayout(v, lp);
                  } catch (Throwable ignored) {
                  }
              }

              private void makeDraggable(View handle, final View target, final WindowManager.LayoutParams lp) {
                  handle.setOnTouchListener(new View.OnTouchListener() {
                      private int ix, iy;
                      private float tx, ty;
                      private boolean moved;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  ix = lp.x;
                                  iy = lp.y;
                                  tx = e.getRawX();
                                  ty = e.getRawY();
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  int dx = (int) (e.getRawX() - tx);
                                  int dy = (int) (e.getRawY() - ty);
                                  if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
                                  lp.x = ix + dx;
                                  lp.y = iy + dy;
                                  updateViewSafe(target, lp);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) v.performClick();
                                  return true;
                          }
                          return false;
                      }
                  });
              }

              private class ReticleView extends View {
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  public ReticleView() {
                      super(DfdOverlayService.this);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);
                      float cx = getWidth() / 2f;
                      float cy = getHeight() / 2f;
                      if (reticleType == 0) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(3.5f);
                          p.setColor(Color.parseColor("#D946EF"));
                          c.drawCircle(cx, cy, 20f, p);
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(Color.parseColor("#00FFCC"));
                          c.drawCircle(cx, cy, 4f, p);
                      } else if (reticleType == 1) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(3f);
                          p.setColor(Color.parseColor("#00FFCC"));
                          c.drawLine(cx - 26f, cy, cx - 7f, cy, p);
                          c.drawLine(cx + 7f, cy, cx + 26f, cy, p);
                          c.drawLine(cx, cy - 26f, cx, cy - 7f, p);
                          c.drawLine(cx, cy + 7f, cx, cy + 26f, p);
                      } else {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(3f);
                          p.setColor(Color.parseColor("#FACC15"));
                          c.drawRect(cx - 18f, cy - 18f, cx + 18f, cy + 18f, p);
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(Color.parseColor("#FF0055"));
                          c.drawCircle(cx, cy, 3.5f, p);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try {
                      if (isMainShown && rootFloating != null) wm.removeView(rootFloating);
                      if (isReticleShown && reticleView != null) wm.removeView(reticleView);
                      if (isRogShown && rogHudBar != null) wm.removeView(rogHudBar);
                  } catch (Throwable ignored) {
                  }
              }
          }
