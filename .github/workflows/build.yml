name: Build DFD TOOLS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 5. Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: 6. Upload Hasil APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DFD-TOOLS-DANZVIP-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
