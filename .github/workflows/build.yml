              private void startFloatingAndGame(boolean launchGame) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          startActivityForResult(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())), 5001);
                          Toast.makeText(this, "Izinkan 'Tampilkan di atas aplikasi lain' untuk DFD TOOLS!", Toast.LENGTH_LONG).show();
                          return;
                      }
                      startService(new Intent(this, DfdOverlayService.class));
                      if (launchGame) {
                          Intent gameIntent = getPackageManager().getLaunchIntentForPackage(ShizukuShellEngine.targetGamePkg);
                          if (gameIntent != null) {
                              gameIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(gameIntent);
                          } else {
                              Toast.makeText(this, "Floating Aktif! Silakan buka Free Fire.", Toast.LENGTH_SHORT).show();
                          }
                      } else {
                          Toast.makeText(this, "Floating Panel DFD TOOLS Aktif!", Toast.LENGTH_SHORT).show();
                      }
                  } catch (Throwable t) {
                      Toast.makeText(this, "Error: " + t.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

