name: Build DFD TOOLS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Konversi Logo APK & Buat Source Code Lengkap (Tanpa Floating Panel)
        shell: bash
        run: |
          set -e
          rm -rf app/build app/src/main
          mkdir -p app/src/main/java/com/danz/dfdtools
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          python3 -m pip install --quiet pillow

          # Cari file gambar logo (.jpg/.jpeg/.png) yang diupload user di repo dan jadikan Icon APK resmi
          USER_IMG=$(find . -maxdepth 3 \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) ! -path "./.git/*" ! -path "./app/*" | head -n 1 || true)
          export USER_IMG

          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          user_img = os.environ.get("USER_IMG", "").strip()
          if user_img and os.path.exists(user_img):
              print(f"Menggunakan gambar logo dari repository: {user_img}")
              im = Image.open(user_img).convert("RGBA")
          else:
              print("Gambar belum diupload ke repo, membuat emblem DANZ INJECT...")
              im = Image.new("RGBA", (512, 512), (8, 2, 16, 255))
              draw = ImageDraw.Draw(im)
              draw.ellipse((24, 24, 488, 488), fill=(26, 8, 48, 255), outline=(192, 38, 211, 255), width=14)
              draw.ellipse((52, 52, 460, 460), outline=(168, 85, 247, 255), width=6)
              # Crown polygon
              draw.polygon([(140, 210), (115, 110), (200, 165), (256, 85), (312, 165), (397, 110), (372, 210)],
                           fill=(216, 180, 254, 255), outline=(255, 255, 255, 255))
              draw.rectangle((140, 215, 372, 235), fill=(147, 51, 234, 255))
              # Crosshair target bottom
              draw.ellipse((226, 400, 286, 460), outline=(168, 85, 247, 255), width=5)
              draw.line((256, 390, 256, 470), fill=(0, 255, 204, 255), width=4)
              draw.line((216, 430, 296, 430), fill=(0, 255, 204, 255), width=4)

          # Simpan ke drawable & assets untuk banner aplikasi
          im.resize((512, 512), Image.LANCZOS).save("app/src/main/res/drawable/dfd_logo.png", "PNG")
          im.resize((512, 512), Image.LANCZOS).save("app/src/main/assets/dfd_logo.png", "PNG")

          # Simpan ke seluruh folder mipmap sebagai Icon APK utama & Round Icon
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, px in sizes.items():
              icon_resized = im.resize((px, px), Image.LANCZOS)
              icon_resized.save(f"app/src/main/res/{folder}/ic_launcher.png", "PNG")
              icon_resized.save(f"app/src/main/res/{folder}/ic_launcher_round.png", "PNG")
          PYEOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "DFD TOOLS"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.danz.dfdtools'
              compileSdk 34

              defaultConfig {
                  applicationId "com.danz.dfdtools"
                  minSdk 26
                  targetSdk 33
                  versionCode 50
                  versionName "5.0-DANZVIP"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }

          dependencies {
              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
          }
          EOF

          # AndroidManifest bersih TANPA Floating Overlay Service (Anti Force Close)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="DFD TOOLS"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/danz/dfdtools/LicenseEngine.java
          package com.danz.dfdtools;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.provider.Settings;

          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.Locale;

          import javax.crypto.Mac;
          import javax.crypto.spec.SecretKeySpec;

          public final class LicenseEngine {

              public static final String MASTER_DEV_KEY = "DANZVIP";
              private static final String HMAC_SECRET = "DFD_TOOLS_DANZ_INJECT_2026_SECRET";
              private static final String PREF_NAME = "dfd_license_vault";
              private static final String KEY_SAVED_TOKEN = "bound_token";
              private static final String KEY_SAVED_HWID = "bound_hwid";
              private static final String KEY_FIRST_BIND_MS = "first_bind_ms";

              public enum Tier {
                  DAY_1("1D", 1L * 86400_000L, "1 DAY"),
                  DAY_3("3D", 3L * 86400_000L, "3 DAYS"),
                  DAY_7("7D", 7L * 86400_000L, "7 DAYS"),
                  DAY_15("15D", 15L * 86400_000L, "15 DAYS"),
                  DAY_30("30D", 30L * 86400_000L, "30 DAYS"),
                  PERM("PERM", 36500L * 86400_000L, "PERMANENT"),
                  RESELLER("RSL", 36500L * 86400_000L, "RESELLER");

                  public final String code;
                  public final long durationMs;
                  public final String label;

                  Tier(String code, long durationMs, String label) {
                      this.code = code;
                      this.durationMs = durationMs;
                      this.label = label;
                  }

                  public static Tier fromCode(String c) {
                      for (Tier t : values()) {
                          if (t.code.equalsIgnoreCase(c)) return t;
                      }
                      return null;
                  }
              }

              public static class AuthResult {
                  public final boolean valid;
                  public final boolean isDeveloper;
                  public final boolean isReseller;
                  public final String roleLabel;
                  public final String message;

                  public AuthResult(boolean valid, boolean isDeveloper, boolean isReseller, String roleLabel, String message) {
                      this.valid = valid;
                      this.isDeveloper = isDeveloper;
                      this.isReseller = isReseller;
                      this.roleLabel = roleLabel;
                      this.message = message;
                  }
              }

              public static String getDeviceHwid(Context ctx) {
                  String aid = Settings.Secure.getString(ctx.getContentResolver(), Settings.Secure.ANDROID_ID);
                  if (aid == null) aid = "AID";
                  String raw = aid + "|" + Build.BOARD + "|" + Build.BRAND + "|" + Build.HARDWARE;
                  try {
                      byte[] d = MessageDigest.getInstance("SHA-256").digest(raw.getBytes(StandardCharsets.UTF_8));
                      return String.format(Locale.US, "DFD-%02X%02X%02X%02X", d[0], d[1], d[2], d[3]);
                  } catch (Exception e) {
                      return "DFD-00000000";
                  }
              }

              public static String generateKey(String targetHwid, Tier tier) {
                  String clean = (targetHwid == null || targetHwid.trim().isEmpty())
                          ? "BIND1"
                          : targetHwid.trim().toUpperCase(Locale.US).replace("DFD-", "");
                  String hoursHex = Long.toHexString(System.currentTimeMillis() / 3600_000L).toUpperCase(Locale.US);
                  String payload = tier.code + "-" + clean + "-" + hoursHex;
                  String sig = hmacHex(payload).substring(0, 8);
                  return "DFD-" + payload + "-" + sig;
              }

              public static AuthResult verifyAndBindKey(Context ctx, String inputKey) {
                  if (inputKey == null || inputKey.trim().isEmpty()) {
                      return new AuthResult(false, false, false, "LOCKED", "Masukkan License Key terlebih dahulu.");
                  }
                  String key = inputKey.trim();
                  String myHwid = getDeviceHwid(ctx);

                  if (MASTER_DEV_KEY.equals(key)) {
                      save(ctx, key, myHwid);
                      return new AuthResult(true, true, true, "DEVELOPER VIP", "MASTER KEY DANZVIP AKTIF • FULL ACCESS");
                  }

                  String[] p = key.split("-");
                  if (p.length != 5 || !"DFD".equalsIgnoreCase(p[0])) {
                      return new AuthResult(false, false, false, "INVALID", "Format Key tidak valid.");
                  }

                  Tier tier = Tier.fromCode(p[1]);
                  if (tier == null) {
                      return new AuthResult(false, false, false, "INVALID", "Durasi Key tidak dikenali.");
                  }

                  String payload = p[1].toUpperCase(Locale.US) + "-" + p[2].toUpperCase(Locale.US) + "-" + p[3].toUpperCase(Locale.US);
                  if (!hmacHex(payload).substring(0, 8).equalsIgnoreCase(p[4])) {
                      return new AuthResult(false, false, false, "INVALID", "Signature Key palsu / tidak sah!");
                  }

                  String shortHwid = myHwid.replace("DFD-", "");
                  if (!"BIND1".equalsIgnoreCase(p[2]) && !shortHwid.equalsIgnoreCase(p[2])) {
                      return new AuthResult(false, false, false, "LOCKED", "DITOLAK! Key terkunci di HWID DFD-" + p[2] + " (1 Key 1 Device)");
                  }

                  SharedPreferences sp = ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                  String savedKey = sp.getString(KEY_SAVED_TOKEN, null);
                  String savedHwid = sp.getString(KEY_SAVED_HWID, null);
                  long firstBind = sp.getLong(KEY_FIRST_BIND_MS, 0L);

                  long issueMs;
                  try {
                      issueMs = Long.parseLong(p[3], 16) * 3600_000L;
                  } catch (Exception e) {
                      return new AuthResult(false, false, false, "ERROR", "Timestamp Key error.");
                  }

                  long now = System.currentTimeMillis();
                  if (!key.equals(savedKey)) {
                      save(ctx, key, myHwid);
                      firstBind = now;
                  } else if (savedHwid != null && !savedHwid.equals(myHwid)) {
                      return new AuthResult(false, false, false, "LOCKED", "1 Key 1 Device: Perangkat tidak cocok!");
                  }

                  long elapsed = Math.max(Math.max(0L, now - issueMs), Math.max(0L, now - firstBind));
                  if (elapsed > tier.durationMs) {
                      return new AuthResult(false, false, false, "EXPIRED", "Key sudah EXPIRED (" + tier.label + ").");
                  }

                  long remHours = Math.max(1L, (tier.durationMs - elapsed) / 3600_000L);
                  return new AuthResult(true, false, tier == Tier.RESELLER, tier.label,
                          "AKTIF [" + tier.label + "] • Sisa: " + remHours + " Jam • " + myHwid);
              }

              private static void save(Context ctx, String k, String hwid) {
                  ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE).edit()
                          .putString(KEY_SAVED_TOKEN, k)
                          .putString(KEY_SAVED_HWID, hwid)
                          .putLong(KEY_FIRST_BIND_MS, System.currentTimeMillis())
                          .apply();
              }

              public static String getSavedKey(Context ctx) {
                  return ctx.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE).getString(KEY_SAVED_TOKEN, "");
              }

              private static String hmacHex(String data) {
                  try {
                      Mac mac = Mac.getInstance("HmacSHA256");
                      mac.init(new SecretKeySpec(HMAC_SECRET.getBytes(StandardCharsets.UTF_8), "HmacSHA256"));
                      byte[] raw = mac.doFinal(data.getBytes(StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      for (byte b : raw) sb.append(String.format(Locale.US, "%02X", b));
                      return sb.toString();
                  } catch (Exception e) {
                      return "0000000000000000";
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/danz/dfdtools/ShizukuShellEngine.java
          package com.danz.dfdtools;

          import android.content.pm.PackageManager;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.lang.reflect.Method;
          import java.nio.charset.StandardCharsets;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          import rikka.shizuku.Shizuku;

          public final class ShizukuShellEngine {

              private static final ExecutorService EXEC = Executors.newSingleThreadExecutor();
              public static volatile String targetGamePkg = "com.dts.freefireth";

              public interface Callback {
                  void onDone(boolean shizukuUsed, int code, String out);
              }

              public static boolean isReady() {
                  try {
                      return Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              public static void requestPermission(int reqCode) {
                  try {
                      if (Shizuku.pingBinder() && Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                          Shizuku.requestPermission(reqCode);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              public static void injectToFreeFire(final String cmdScript, final Callback cb) {
                  EXEC.execute(() -> {
                      boolean usedShizuku = false;
                      int exit = -1;
                      StringBuilder sb = new StringBuilder();
                      Process proc = null;
                      try {
                          if (isReady()) {
                              usedShizuku = true;
                              Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                              m.setAccessible(true);
                              proc = (Process) m.invoke(null, new String[]{"sh"}, null, null);
                          } else {
                              proc = Runtime.getRuntime().exec(new String[]{"sh"});
                          }

                          String pkg = targetGamePkg;
                          String fullCmd = String.format(Locale.US,
                                  "FF_PID=$(pidof %s 2>/dev/null || pgrep -f %s 2>/dev/null | head -n 1);\n" +
                                  "if [ -n \"$FF_PID\" ]; then\n" +
                                  "  renice -n -15 -p $FF_PID 2>/dev/null || true;\n" +
                                  "  ionice -c 1 -n 0 -p $FF_PID 2>/dev/null || true;\n" +
                                  "fi;\n" +
                                  "%s\nexit\n", pkg, pkg, cmdScript);

                          OutputStream os = proc.getOutputStream();
                          os.write(fullCmd.getBytes(StandardCharsets.UTF_8));
                          os.flush();
                          os.close();

                          BufferedReader br = new BufferedReader(new InputStreamReader(proc.getInputStream()));
                          String line;
                          while ((line = br.readLine()) != null) {
                              sb.append(line).append(' ');
                          }
                          br.close();
                          exit = proc.waitFor();
                      } catch (Throwable t) {
                          sb.append(t.getMessage());
                      } finally {
                          if (proc != null) proc.destroy();
                      }
                      if (cb != null) cb.onDone(usedShizuku, exit, sb.toString().trim());
                  });
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/danz/dfdtools/LogoHelper.java
          package com.danz.dfdtools;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PorterDuff;
          import android.graphics.PorterDuffXfermode;
          import android.graphics.Rect;

          import java.io.InputStream;

          public final class LogoHelper {

              public static Bitmap loadUserLogo(Context ctx, int sizePx) {
                  Bitmap raw = null;
                  try {
                      int id = ctx.getResources().getIdentifier("dfd_logo", "drawable", ctx.getPackageName());
                      if (id != 0) raw = BitmapFactory.decodeResource(ctx.getResources(), id);
                      if (raw == null) {
                          InputStream is = ctx.getAssets().open("dfd_logo.png");
                          raw = BitmapFactory.decodeStream(is);
                          is.close();
                      }
                  } catch (Throwable ignored) {
                  }

                  if (raw == null) {
                      raw = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.ARGB_8888);
                      raw.eraseColor(Color.parseColor("#7E22CE"));
                  }

                  Bitmap scaled = Bitmap.createScaledBitmap(raw, sizePx, sizePx, true);
                  Bitmap out = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(out);

                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Rect r = new Rect(0, 0, sizePx, sizePx);
                  c.drawCircle(sizePx / 2f, sizePx / 2f, (sizePx / 2f) - 3f, p);
                  p.setXfermode(new PorterDuffXfermode(PorterDuff.Mode.SRC_IN));
                  c.drawBitmap(scaled, r, r, p);

                  Paint ring = new Paint(Paint.ANTI_ALIAS_FLAG);
                  ring.setStyle(Paint.Style.STROKE);
                  ring.setStrokeWidth(4.5f);
                  ring.setColor(Color.parseColor("#D946EF"));
                  c.drawCircle(sizePx / 2f, sizePx / 2f, (sizePx / 2f) - 2.5f, ring);
                  return out;
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/danz/dfdtools/MainActivity.java
          package com.danz.dfdtools;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
