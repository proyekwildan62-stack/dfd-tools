                  bar.setPadding(24, 10, 24, 10);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#E6090214"));
                  bg.setStroke(3, Color.parseColor("#00FFCC"));
                  bg.setCornerRadius(30f);
                  bar.setBackground(bg);

                  rogTelemetryText = new TextView(this);
                  rogTelemetryText.setTextColor(Color.parseColor("#00FFCC"));
                  rogTelemetryText.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  rogTelemetryText.setTextSize(10.5f);
                  rogTelemetryText.setText("👑 DANZ ROG | 60 FPS | 38.0°C | RAM --%");
                  bar.addView(rogTelemetryText);

                  rogTelemetryHud = bar;
                  rogBarParams = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          getOverlayWindowType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                  );
                  rogBarParams.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  rogBarParams.y = 18;
              }

              private void setReticleActive(boolean on) {
                  try {
                      if (on && !isReticleAdded) {
                          wm.addView(reticleView, reticleParams);
                          isReticleAdded = true;
                      } else if (!on && isReticleAdded) {
                          wm.removeView(reticleView);
                          isReticleAdded = false;
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private void setRogHudActive(boolean on) {
                  try {
                      if (on && !isRogHudAdded) {
                          wm.addView(rogTelemetryHud, rogBarParams);
                          isRogHudAdded = true;
                          lastFpsTimestampNs = 0;
                          accumulatedFrames = 0;
                          Choreographer.getInstance().postFrameCallback(frameCallback);
                          uiHandler.post(telemetryTick);
                      } else if (!on && isRogHudAdded) {
                          isRogHudAdded = false;
                          uiHandler.removeCallbacks(telemetryTick);
                          wm.removeView(rogTelemetryHud);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private void runTweak(final String label, String script) {
                  ShizukuShellEngine.execAsync(script, (viaShizuku, exitCode, output) -> {
                      uiHandler.post(() -> {
                          String mode = viaShizuku ? "SHIZUKU" : "SHELL";
                          consoleLogBar.setText(String.format(Locale.US, "[%s] %s", mode, label));
                      });
                  });
              }

              private void safeUpdateLayout(View v, WindowManager.LayoutParams lp) {
                  try {
                      if (isMainAdded && v != null) wm.updateViewLayout(v, lp);
                  } catch (Throwable ignored) {
                  }
              }

              private float readSoCTemperature() {
                  String[] paths = {
                          "/sys/class/thermal/thermal_zone0/temp",
                          "/sys/devices/virtual/thermal/thermal_zone0/temp"
                  };
                  for (String p : paths) {
                      try (BufferedReader br = new BufferedReader(new FileReader(p))) {
                          String line = br.readLine();
                          if (line != null) {
                              float val = Float.parseFloat(line.trim());
                              return val > 1000 ? (val / 1000f) : val;
                          }
                      } catch (Throwable ignored) {
                      }
                  }
                  return 38.5f;
              }

              private int readRamUsagePercent() {
                  try {
                      ActivityManager am = (ActivityManager) getSystemService(ACTIVITY_SERVICE);
                      ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                      if (am != null) {
                          am.getMemoryInfo(mi);
                          long used = mi.totalMem - mi.availMem;
                          return (int) ((used * 100L) / mi.totalMem);
                      }
                  } catch (Throwable ignored) {
                  }
                  return 52;
              }

              private void bindDragHandle(View handle, final View targetWindow, final WindowManager.LayoutParams lp) {
                  handle.setOnTouchListener(new View.OnTouchListener() {
                      private int startX, startY;
                      private float touchX, touchY;
                      private boolean moved;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  startX = lp.x;
                                  startY = lp.y;
                                  touchX = event.getRawX();
                                  touchY = event.getRawY();
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  int dx = (int) (event.getRawX() - touchX);
                                  int dy = (int) (event.getRawY() - touchY);
                                  if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
                                  lp.x = startX + dx;
                                  lp.y = startY + dy;
                                  safeUpdateLayout(targetWindow, lp);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) v.performClick();
                                  return true;
                          }
                          return false;
                      }
                  });
              }

              private class ReticleOverlayView extends View {
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  public ReticleOverlayView() {
                      super(DfdOverlayService.this);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      float cx = getWidth() / 2f;
                      float cy = getHeight() / 2f;

                      if (reticleStyle == 0) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(3.5f);
                          p.setColor(Color.parseColor("#E879F9"));
                          canvas.drawCircle(cx, cy, 22f, p);

                          p.setStyle(Paint.Style.FILL);
                          p.setColor(Color.parseColor("#00FFCC"));
                          canvas.drawCircle(cx, cy, 4.5f, p);
                      } else if (reticleStyle == 1) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(3f);
                          p.setColor(Color.parseColor("#00FFCC"));
                          canvas.drawLine(cx - 28f, cy, cx - 8f, cy, p);
                          canvas.drawLine(cx + 8f, cy, cx + 28f, cy, p);
                          canvas.drawLine(cx, cy - 28f, cx, cy - 8f, p);
                          canvas.drawLine(cx, cy + 8f, cx, cy + 28f, p);
                          canvas.drawCircle(cx, cy, 2.5f, p);
                      } else {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(3f);
                          p.setColor(Color.parseColor("#FACC15"));
                          canvas.drawRect(cx - 20f, cy - 20f, cx + 20f, cy + 20f, p);
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(Color.parseColor("#FF0055"));
                          canvas.drawCircle(cx, cy, 4f, p);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  ShizukuShellEngine.execAsync("wm size reset; wm density reset; cmd notification set_dnd off", null);
                  try {
                      if (isMainAdded && floatingRoot != null) wm.removeView(floatingRoot);
                      if (isReticleAdded && reticleView != null) wm.removeView(reticleView);
                      if (isRogHudAdded && rogTelemetryHud != null) wm.removeView(rogTelemetryHud);
                  } catch (Throwable ignored) {
                  }
              }
          }
          EOF

      - name: 4. Install SDK & Compile APK
        shell: bash
        run: |
          set -e
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 5. Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: DFD-TOOLS-DANZVIP-V2-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
