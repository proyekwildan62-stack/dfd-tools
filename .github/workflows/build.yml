          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Choreographer;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Spinner;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Locale;

          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {

              private static final String PREF_TWEAKS = "dfd_tweak_states";

              private TextView shizukuBadge;
              private TextView authStatusTv;
              private TextView liveConsoleTv;
              private TextView rogTelemetryTv;
              private CrosshairPreviewView crosshairPreview;

              private LinearLayout authGateCard;
              private LinearLayout mainInjectorContainer;

              private LinearLayout pageCombat;
              private LinearLayout pageSystem;
              private LinearLayout pageKeygen;
              private Button tabBtnCombat;
              private Button tabBtnSystem;
              private Button tabBtnKeygen;

              private boolean isRogMonitorActive = true;
              private int crosshairStyle = 0;

              private final Handler uiHandler = new Handler(Looper.getMainLooper());
              private long lastFrameNs = 0;
              private int frameCount = 0;
              private int currentFps = 60;

              private final Choreographer.FrameCallback fpsCallback = new Choreographer.FrameCallback() {
                  @Override
                  public void doFrame(long frameTimeNanos) {
                      if (lastFrameNs == 0) lastFrameNs = frameTimeNanos;
                      frameCount++;
                      long diff = frameTimeNanos - lastFrameNs;
                      if (diff >= 1_000_000_000L) {
                          currentFps = (int) ((frameCount * 1_000_000_000L) / diff);
                          frameCount = 0;
                          lastFrameNs = frameTimeNanos;
                      }
                      if (isRogMonitorActive) {
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  }
              };

              private final Runnable rogUpdater = new Runnable() {
                  @Override
                  public void run() {
                      if (isRogMonitorActive && rogTelemetryTv != null) {
                          float temp = getBatteryTemp();
                          int ram = getRamPercent();
                          int cores = Runtime.getRuntime().availableProcessors();
                          String mode = ShizukuShellEngine.isReady() ? "SHIZUKU UID-2000" : "SHELL LOCAL";
                          rogTelemetryTv.setText(String.format(Locale.US,
                                  "FPS REAL : %d FPS   |   SUHU HP : %.1f°C\nRAM USED : %d%%      |   CPU     : %d CORES (%s)",
                                  currentFps, temp, ram, cores, mode));
                          uiHandler.postDelayed(this, 1000L);
                      }
                  }
              };

              private final Shizuku.OnRequestPermissionResultListener permListener =
                      (req, res) -> runOnUiThread(this::refreshShizukuStatus);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      Shizuku.addRequestPermissionResultListener(permListener);
                  } catch (Throwable ignored) {
                  }
                  buildDirectInjectorApp();
                  refreshShizukuStatus();
                  Choreographer.getInstance().postFrameCallback(fpsCallback);
                  uiHandler.post(rogUpdater);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refreshShizukuStatus();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  isRogMonitorActive = false;
                  uiHandler.removeCallbacks(rogUpdater);
                  try {
                      Shizuku.removeRequestPermissionResultListener(permListener);
                  } catch (Throwable ignored) {
                  }
              }

              private void buildDirectInjectorApp() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.parseColor("#07020E"));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(30, 36, 30, 60);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  scroll.addView(root);

                  // === 1. HERO HEADER CARD (LOGO DANZ INJECT ASLI) ===
                  LinearLayout hero = makeCard("#130726", "#C026D3");
                  hero.setGravity(Gravity.CENTER_HORIZONTAL);

                  ImageView logo = new ImageView(this);
                  logo.setImageBitmap(LogoHelper.loadUserLogo(this, 210));
                  LinearLayout.LayoutParams lpLogo = new LinearLayout.LayoutParams(210, 210);
                  lpLogo.bottomMargin = 12;
                  hero.addView(logo, lpLogo);

                  TextView title = new TextView(this);
                  title.setText("DFD TOOLS // DANZ INJECT");
                  title.setTextColor(Color.parseColor("#F0ABFC"));
                  title.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  title.setTextSize(18f);
                  hero.addView(title);

