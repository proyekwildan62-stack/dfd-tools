name: Build DFD TOOLS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Pasang Logo Asli & Rakit Source Code DFD TOOLS
        shell: bash
        run: |
          set -e
          rm -rf app/build app/src/main/res
          mkdir -p app/src/main/java/com/danz/dfdtools
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          # Cari file gambar logo asli (5140.jpg / .png) yang diupload user di repo
          USER_LOGO=$(find . -maxdepth 4 \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) ! -path "./.git/*" ! -path "./app/build/*" | head -n 1 || true)
          if [ -n "$USER_LOGO" ]; then
            echo "Menggunakan logo asli dari: $USER_LOGO"
            cp "$USER_LOGO" app/src/main/res/drawable/dfd_logo.jpg
            cp "$USER_LOGO" app/src/main/assets/dfd_logo.jpg
          else
            # Buat fallback PNG hanya jika user belum upload gambar sama sekali
            python3 - << 'PYEOF'
          import struct, zlib
          def make_png(w, h):
              raw = b""
              for y in range(h):
                  raw += b"\x00"
                  for x in range(w):
                      raw += bytes([147, 51, 234, 255])
              def chunk(t, d):
                  return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("app/src/main/res/drawable/dfd_logo.png", "wb").write(make_png(192, 192))
          PYEOF
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "DFD TOOLS"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.danz.dfdtools'
              compileSdk 34

              defaultConfig {
                  applicationId "com.danz.dfdtools"
                  minSdk 26
                  targetSdk 33
                  versionCode 40
                  versionName "4.0-DANZVIP"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }

          dependencies {
              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
          }
          EOF

          # AndroidManifest langsung memakai @drawable/dfd_logo (foto 5140.jpg asli) sebagai icon APK
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/dfd_logo"
                  android:roundIcon="@drawable/dfd_logo"
                  android:label="DFD TOOLS"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DfdOverlayService"
