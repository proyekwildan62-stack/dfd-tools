              private void styleTabButton(Button b, boolean active) {
                  GradientDrawable gd = new GradientDrawable();
                  if (active) {
                      gd.setColor(Color.parseColor("#9333EA"));
                      gd.setStroke(2, Color.parseColor("#00FFCC"));
                      b.setTextColor(Color.WHITE);
                  } else {
                      gd.setColor(Color.parseColor("#180730"));
                      gd.setStroke(2, Color.parseColor("#4C1D95"));
                      b.setTextColor(Color.parseColor("#A855F7"));
                  }
                  gd.setCornerRadius(14f);
                  b.setBackground(gd);
              }

              private void styleGameButton(Button b, boolean selected) {
                  GradientDrawable gd = new GradientDrawable();
