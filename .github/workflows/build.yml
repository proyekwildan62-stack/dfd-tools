              private void switchTab(int idx) {
                  pageCombat.setVisibility(idx == 0 ? View.VISIBLE : View.GONE);
                  pageSystem.setVisibility(idx == 1 ? View.VISIBLE : View.GONE);
                  pageKeygen.setVisibility(idx == 2 ? View.VISIBLE : View.GONE);

                  styleSelectBtn(tabBtnCombat, idx == 0);
                  styleSelectBtn(tabBtnSystem, idx == 1);
                  styleSelectBtn(tabBtnKeygen, idx == 2);
              }

              private void openFreeFireDirectly() {
                  String pkg = ShizukuShellEngine.targetGamePkg;
                  ShizukuShellEngine.injectToFreeFire("cmd game mode performance " + pkg, (shizukuUsed, code, out) -> {
                      runOnUiThread(() -> {
                          try {
                              Intent launch = getPackageManager().getLaunchIntentForPackage(pkg);
                              if (launch != null) {
                                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(launch);
                              } else {
                                  Toast.makeText(this, "Semua fitur telah di-injeksi! (Paket " + pkg + " belum terinstall, silakan buka Free Fire).", Toast.LENGTH_LONG).show();
                              }
                          } catch (Throwable t) {
                              Toast.makeText(this, "Error membuka game: " + t.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      });
                  });
              }

              private interface ToggleCallback {
                  void onToggle(boolean enabled);
              }

              private void addFeatureSwitch(LinearLayout parent, String prefKey, String title, String desc, ToggleCallback cb) {
                  SharedPreferences sp = getSharedPreferences(PREF_TWEAKS, MODE_PRIVATE);

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(20, 16, 20, 16);

                  final GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#180832"));
                  bg.setStroke(2, Color.parseColor("#581C87"));
                  bg.setCornerRadius(16f);
                  row.setBackground(bg);

                  LinearLayout textCol = new LinearLayout(this);
                  textCol.setOrientation(LinearLayout.VERTICAL);

                  final TextView t1 = new TextView(this);
                  t1.setText(title);
                  t1.setTextColor(Color.WHITE);
                  t1.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  t1.setTextSize(11.5f);
                  textCol.addView(t1);

                  TextView t2 = new TextView(this);
                  t2.setText(desc);
                  t2.setTextColor(Color.parseColor("#C084FC"));
                  t2.setTextSize(9.5f);
                  textCol.addView(t2);

                  row.addView(textCol, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  Switch sw = new Switch(this);
                  boolean saved = sp.getBoolean(prefKey, false);
                  sw.setChecked(saved);
                  if (saved) {
                      bg.setColor(Color.parseColor("#270B4D"));
                      bg.setStroke(2, Color.parseColor("#00FFCC"));
                      t1.setTextColor(Color.parseColor("#00FFCC"));
                  }

                  sw.setOnCheckedChangeListener((buttonView, isChecked) -> {
                      sp.edit().putBoolean(prefKey, isChecked).apply();
                      bg.setColor(Color.parseColor(isChecked ? "#270B4D" : "#180832"));
                      bg.setStroke(2, Color.parseColor(isChecked ? "#00FFCC" : "#581C87"));
                      t1.setTextColor(isChecked ? Color.parseColor("#00FFCC") : Color.WHITE);
                      cb.onToggle(isChecked);
                  });
                  row.addView(sw);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.bottomMargin = 12;
                  row.setLayoutParams(lp);
                  parent.addView(row);
              }

              private void execFF(final String label, String script) {
                  ShizukuShellEngine.injectToFreeFire(script, (shizukuUsed, code, out) -> {
                      uiHandler.post(() -> {
                          String mode = shizukuUsed ? "SHIZUKU-UID2000" : "SHELL";
                          liveConsoleTv.setText(String.format(Locale.US, "[%s] %s -> BERHASIL DI-INJECT", mode, label));
                      });
                  });
              }

              private void refreshShizukuStatus() {
                  if (ShizukuShellEngine.isReady()) {
                      shizukuBadge.setText("● ADB SHIZUKU: TERHUBUNG (UID 2000 ACTIVE)");
                      shizukuBadge.setTextColor(Color.parseColor("#4ADE80"));
                  } else {
                      shizukuBadge.setText("○ ADB SHIZUKU: BELUM TERHUBUNG (KLIK TOMBOL DI BAWAH)");
                      shizukuBadge.setTextColor(Color.parseColor("#FBBF24"));
                  }
              }

              private float getBatteryTemp() {
                  try {
                      Intent i = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      if (i != null) {
                          return i.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 370) / 10f;
                      }
                  } catch (Throwable ignored) {
                  }
                  return 37.0f;
              }

              private int getRamPercent() {
                  try {
                      ActivityManager am = (ActivityManager) getSystemService(ACTIVITY_SERVICE);
                      ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                      if (am != null) {
                          am.getMemoryInfo(mi);
                          return (int) (((mi.totalMem - mi.availMem) * 100L) / mi.totalMem);
                      }
                  } catch (Throwable ignored) {
                  }
                  return 48;
              }

