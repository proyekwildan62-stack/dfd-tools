plugins {
    id 'com.android.application'
}

android {
    namespace 'com.danz.dfdtools'
    compileSdk 34

    defaultConfig {
        applicationId "com.danz.dfdtools"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "1.0-DANZVIP"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
